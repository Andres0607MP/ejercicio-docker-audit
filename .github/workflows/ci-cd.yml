name: Pipeline CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Pruebas unitarias (pytest)
  # ──────────────────────────────────────────────────────────
  test:
    name: Pruebas unitarias (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest -v

  # ──────────────────────────────────────────────────────────
  # JOB 2: Escaneo de vulnerabilidades con Bandit
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: Escaneo de seguridad (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Escanear con Bandit
        run: bandit -r . -x './.venv,./venv,./.git' -c bandit.yaml

  # ──────────────────────────────────────────────────────────
  # JOB 3: Construcción de imagen Docker (único build)
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Construcción de imagen Docker
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraer metadatos de Docker Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andresmancera/mi-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir imagen Docker (un solo build, todos los tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            legacyapp:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}

      - name: Guardar imagen como artefacto
        run: |
          docker save legacyapp:${{ github.sha }} -o /tmp/legacyapp.tar

      - name: Subir artefacto de imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/legacyapp.tar

  # ──────────────────────────────────────────────────────────
  # JOB 4: Escaneo de vulnerabilidades con Trivy
  # ──────────────────────────────────────────────────────────
  trivy-scan:
    name: Escaneo de vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artefacto de imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen Docker
        run: |
          docker load -i /tmp/legacyapp.tar

      - name: Ejecutar escáner de vulnerabilidades Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: legacyapp:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignorefile: .trivyignore

  # ──────────────────────────────────────────────────────────
  # JOB 5: Publicar imagen en Docker Hub (solo push a main)
  # IMPORTANTE: Reutiliza la MISMA imagen escaneada por Trivy.
  # No hace un segundo build.
  # ──────────────────────────────────────────────────────────
  publish-dockerhub:
    name: Publicar en Docker Hub
    runs-on: ubuntu-latest
    needs: [test, security-scan, trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artefacto de imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen Docker (misma imagen escaneada por Trivy)
        run: |
          docker load -i /tmp/legacyapp.tar

      - name: Extraer metadatos de Docker Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andresmancera/mi-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Etiquetar imagen para Docker Hub
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker tag legacyapp:${{ github.sha }} "$tag"
          done

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Subir imagen a Docker Hub
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

  # ──────────────────────────────────────────────────────────
  # JOB 6: Despliegue a EC2 vía SSH (solo push a main)
  # ──────────────────────────────────────────────────────────
  # IMPORTANTE:
  #   - No hace rebuild. Usa la misma imagen publicada en Docker Hub.
  #   - Copia docker-compose.yml al EC2 vía SCP.
  #   - Crea .env con credenciales desde GitHub Secrets (NO hardcodeado).
  #   - Ejecuta docker login → docker compose pull → docker compose up -d
  #   - Requiere secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY,
  #     DOCKER_USERNAME, DOCKER_PASSWORD, MYSQL_ROOT_PASSWORD,
  #     DB_NAME, DB_USER, DB_PASS.
  # ──────────────────────────────────────────────────────────
  deploy-ec2:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [test, security-scan, trivy-scan, publish-dockerhub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar compose al EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/deploy/"

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG,MYSQL_ROOT_PASSWORD,DB_NAME,DB_USER,DB_PASS
          script: |
            set -e
            mkdir -p ~/deploy
            cd ~/deploy

            # Crear .env con credenciales (usando printf para caracteres especiales)
            printf '%s\n' \
              "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}" \
              "DB_NAME=${DB_NAME}" \
              "DB_USER=${DB_USER}" \
              "DB_PASS=${DB_PASS}" \
              "DB_HOST=mysql" \
              "DB_PORT=3306" \
              "IMAGE_TAG=${IMAGE_TAG}" > .env
            chmod 600 .env

            # Login a Docker Hub (usando --password-stdin)
            echo "${DOCKER_PASSWORD}" | docker login \
              --username "${DOCKER_USERNAME}" \
              --password-stdin

            # Pull de la imagen y levantar stack
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml ps
